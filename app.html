<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Notion-like BlockNote Workspace</title>

  <!-- BlockNote vanilla-JS CSS. The JS below loads BlockNote core from CDN. -->
  <link rel="preconnect" href="https://esm.sh">
  <link rel="stylesheet" href="https://esm.sh/@blocknote/core@0.51.3/style.css">
  <link rel="stylesheet" href="https://esm.sh/@blocknote/core@0.51.3/fonts/inter.css">

    <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/app.css">

</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brandbar">
        <div class="brand"><div class="brand-mark">N</div><span>Notes</span></div>
        <div class="toolbar">
          <button class="icon-btn" id="collapseAll" title="Collapse all">−</button>
          <button class="icon-btn" id="newTopPage" title="New page">＋</button>
        </div>
      </div>
      <div class="sidebar-tools">
        <button class="new-page" id="newPageBtn"><span>＋</span><span>New page</span></button>
      </div>
      <div class="sidebar-section">Workspace</div>
      <div id="pageTree"></div>
      <div class="sidebar-footer">
        <span>IndexedDB</span>
        <span id="saveState">Ready</span>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div class="breadcrumbs" id="breadcrumbs"></div>
        <div class="top-actions">
          <button class="top-action" id="reloadBtn">Reload</button>
          <button class="top-action primary" id="saveBtn">Save</button>
        </div>
      </div>

      <div class="workspace" id="workspace">
        <article class="document">
          <input id="pageTitle" class="page-title" placeholder="Untitled" autocomplete="off" spellcheck="true">
          <div id="editor"></div>
          <div class="hint">Type <strong>/</strong> for blocks. Press Tab / Shift+Tab to nest or unnest blocks.</div>
        </article>
      </div>
    </main>
  </div>

  <div id="slashMenu" role="menu" aria-label="Block commands"></div>
  <div id="contextMenu" role="menu" aria-label="Page actions"></div>

  <script type="module" src="js/app-module.js"></script>
</body>
</html>
